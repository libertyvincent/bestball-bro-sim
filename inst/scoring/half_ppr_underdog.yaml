id: half_ppr_underdog
name: "Half PPR (Underdog)"
version: "1.0.0"

# Match against the Underdog scoring_types endpoint to verify rules don't drift.
# Pulled from /v1/scoring_types -- confirm at runtime before locking.
underdog_scoring_type_id: "ccf300b0-9197-5951-bd96-cba84ad71e86"

rules:
  passing:
    yards_per_point: 25       # 0.04 pts/yard
    td_points: 4
    int_points: -1
    sack_points: 0
    two_point_points: 2
  rushing:
    yards_per_point: 10       # 0.1 pts/yard
    td_points: 6
    two_point_points: 2
    fumble_lost_points: -2
  receiving:
    reception_points: 0.5     # half PPR
    yards_per_point: 10       # 0.1 pts/yard
    td_points: 6
    two_point_points: 2
    fumble_lost_points: -2

  # TE premium = 0 for standard half PPR.
  # The Big Board reportedly uses TE premium; if confirmed, create
  # half_ppr_underdog_te_premium.yaml with this set to 0.5 instead.
  te_premium_points: 0
