# Weekly Winners
# 17 independent weekly prize pools. One shared draft enters all 17 weeks.
# Each week ranks ALL 186,840 entries by that week's starting lineup points.

tournament_id: weekly_winners_2026
underdog_tournament_id: 21004ed7-7e8d-49e0-b87c-5f09a3edb77a
display_name: Weekly Winners
description: "A Best Ball Contest with Weekly Prizes!"
rules_url: https://app.underdogfantasy.com/rules/best-ball-weekly-winners
image_url: https://assets.underdogfantasy.com/assets/royale/weeklywinners.png

slate_id: nfl_2026_weekly_winners
underdog_slate_id: d9fd5f58-393f-400c-a010-3bf79b822b48

entry_fee_usd: 10
total_field_size: 186840
max_entries_per_user: 150
draft_size: 12
draft_rounds: 18
pick_clock_seconds: 20
rake_pct: 0.09
cutoff_at: "2026-09-09T22:26:00Z"

# Special structure marker - different from advancement tournaments
structure_type: independent_weekly_pools

inherits_common_rules: true

scoring:
  receptions: 0.5
  receiving_td: 6
  receiving_yard: 0.1
  rushing_td: 6
  rushing_yard: 0.1
  passing_yard: 0.04
  passing_td: 4
  interception: -1
  two_pt_conversion: 2
  fumble_lost: -2

roster:
  total_slots: 18
  starting_lineup:
    QB: 1
    RB: 2
    WR: 3
    TE: 1
    FLEX: 1
  bench: 10
  # Position caps inherited from slate (nfl_2026_weekly_winners): QB:4, RB:9, WR:10, TE:5

best_ball_lineup_rule:
  flex_eligible: [RB, WR, TE]
  flex_selection: highest_weekly_score_among_overflow_RB_WR_TE

simulator_output_schema:
  primary_unit: per_player_per_week_ev
  derived_aggregation: sum_across_weeks_for_season_total
  rationale: |
    Each week is an independent prize pool. Per-week EV is the natural
    computational unit. Season total is just the sum. Both exposed.
    Drafters may want to target specific weeks (bye-week stacks, etc.)
    so per-week breakdown is first-class output, not diagnostic.

bye_week_strategy_note: |
  Week 11 has the most teams on bye in 2026. Stacking bye weeks is a
  legitimate strategy: sacrifice expected score in some weeks to maximize
  active-player count (and thus expected score) in target weeks. The
  field simulation in Layer B should naturally capture this since real
  drafters employ varying bye-week construction strategies.

