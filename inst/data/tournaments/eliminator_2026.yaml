roster:
  total_slots: 18
  starting_lineup:
    QB: 1
    RB: 2
    WR: 3
    TE: 1
    FLEX: 1
  bench: 10
  # Position caps inherited from slate (nfl_2026_eliminator): QB:4, RB:9, WR:10, TE:5

best_ball_lineup_rule:
  flex_eligible: [RB, WR, TE]
  flex_selection: highest_weekly_score_among_overflow_RB_WR_TE

simulator_output_schema:
  primary_unit: per_player_total_ev
  per_week_breakdown: diagnostic_only
  rationale: |
    Each elimination week matters individually but player value is dominated
    by contribution to surviving each round. Total EV is the natural unit.

