# Tournament-config generator input.
#
# Each row here gets expanded into a canonical inst/data/tournaments/<id>.yaml
# by generate_all_tournament_configs(). Adding a tournament = one row.
#
# Scope: the 4-stage Season-slate shape (qualifier on weeks 1-14, QF/SF/Final
# on weeks 15/16/17). Eliminator-format tournaments (17-round H2H) and
# Weekly-Winners (independent weekly pools) use different structures and stay
# hand-written under inst/data/tournaments/.
#
# `stages` is the advance/pod shorthand for stages 1-3; final_seats is the
# championship single-pod size. The generator computes total_field_size and
# every stage's seats_entering by walking the math backward and aborts if it
# doesn't divide evenly.
#
# `write_to_disk: false` keeps the generator from clobbering a richer
# hand-written canonical file (e.g. BBM7's tiered payouts). The test suite
# still uses the generated in-memory list to round-trip-check the schema.

