slates:
  nfl_2026_season:
    underdog_slate_id: a9c04e81-1ace-4b16-a31d-4c725a47f16f
    display_name: NFL 2026 Season
    season: 2026
    scoring_id: half_ppr_underdog
    csv_file: nfl_2026_season.csv
    enabled: true
    position_caps:
      QB: 4
      RB: 9
      WR: 10
      TE: 5
    # YAML quirk: the unquoted key `n` parses as the boolean FALSE under
    # YAML 1.1, which is what the `yaml` R package implements. We quote
    # `"n"` so it survives as the string key the loader expects.
    starting_lineup:
      slots:
        - { pos: QB,   "n": 1 }
        - { pos: RB,   "n": 2 }
        - { pos: WR,   "n": 3 }
        - { pos: TE,   "n": 1 }
        - { pos: FLEX, "n": 1, eligible: [RB, WR, TE] }
  nfl_2026_eliminator:
    # UUID verified against the udbb-scraper export (2026-05-27): this slate's
    # captured draft runs 18 rounds with the first QB taken at pick 25 (standard
    # 1-QB lineup) and hosts The Frenchie Eliminator (88fcfddf). Not transposed
    # with nfl_2026_superflex -- see inst/scripts/diag_verify_slate_uuids.py.
    underdog_slate_id: 0ee05b31-f904-4e6e-985b-42f290e3aa3a
    display_name: NFL 2026 Eliminator Season
    season: 2026
    scoring_id: half_ppr_underdog
    csv_file: nfl_2026_eliminator.csv
    enabled: true
    position_caps:
      QB: 4
      RB: 9
      WR: 10
      TE: 5
    starting_lineup:
      slots:
        - { pos: QB,   "n": 1 }
        - { pos: RB,   "n": 2 }
        - { pos: WR,   "n": 3 }
        - { pos: TE,   "n": 1 }
        - { pos: FLEX, "n": 1, eligible: [RB, WR, TE] }
  nfl_2026_weekly_winners:
    underdog_slate_id: d9fd5f58-393f-400c-a010-3bf79b822b48
    display_name: NFL 2026 Weekly Winners Season
    season: 2026
    scoring_id: half_ppr_underdog
    csv_file: nfl_2026_weekly_winners.csv
    enabled: true
    position_caps:
      QB: 4
      RB: 9
      WR: 10
      TE: 5
    starting_lineup:
      slots:
        - { pos: QB,   "n": 1 }
        - { pos: RB,   "n": 2 }
        - { pos: WR,   "n": 3 }
        - { pos: TE,   "n": 1 }
        - { pos: FLEX, "n": 1, eligible: [RB, WR, TE] }
  nfl_2026_superflex:
    # UUID verified against the udbb-scraper export (2026-05-27): this slate's
    # captured draft runs 20 rounds with 8 QBs taken in round 1 (QB #1 overall,
    # teams roster up to 6 QBs) and hosts The Field General (08bddf11) -- it is
    # genuinely the Superflex slate. Not transposed with nfl_2026_eliminator --
    # see inst/scripts/diag_verify_slate_uuids.py.
    underdog_slate_id: 11300882-a76f-4e12-8a5e-1a6b4c513794
    display_name: NFL 2026 Superflex Season
    season: 2026
    scoring_id: half_ppr_underdog
    csv_file: nfl_2026_superflex.csv
    enabled: true
    position_caps:
      QB: 6
      RB: 10
      WR: 12
      TE: 5
    # Superflex starting lineup: 2 WR (not 3 like Season-family slates),
    # plus a SFLEX slot that adds QB to the FLEX-eligible pool. Matches
    # the frenchie3_superflex.yaml tournament definition.
    starting_lineup:
      slots:
        - { pos: QB,    "n": 1 }
        - { pos: RB,    "n": 2 }
        - { pos: WR,    "n": 2 }
        - { pos: TE,    "n": 1 }
        - { pos: FLEX,  "n": 1, eligible: [RB, WR, TE] }
        - { pos: SFLEX, "n": 1, eligible: [QB, RB, WR, TE] }
