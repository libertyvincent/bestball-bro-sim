name: Build and publish feed

# Daily during draft season (April–August), weekly during regular season.
# Adjust the cron expression as the season transitions, or split into two
# workflows with seasonal `on.schedule` blocks.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      tournaments:
        description: "Comma-separated tournament IDs to rebuild (default: all)"
        required: false
        default: "all"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # building blocks per tournament is the long pole

    steps:
      - name: Checkout sim repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::nflreadr
            any::nflfastR
            any::jsonlite
            any::yaml
            any::dplyr
            any::tidyr
            any::purrr
            any::arrow
            any::lubridate
            any::cli
            any::devtools

      - name: Verify tournament configs parse
        run: Rscript -e 'devtools::load_all(); invisible(lapply(list_tournaments(), load_tournament_config))'

      - name: Create build directories
        # Primes the feed tree so publish_* writes into an existing path.
        # (dir.create(recursive = TRUE) inside the publish functions also
        # handles this, but creating up front keeps the workflow obvious.)
        run: mkdir -p build/feed/v1/projections

      - name: Generate and publish v0 feed
        # v0 pipeline: project for the active season, write the projections
        # JSON, then write the manifest. Season simulations and Layer B
        # tournament precompute are v1 work and intentionally not invoked
        # here. season is pinned to the active best ball draft season;
        # nflreadr's current_season() lags during the offseason and would
        # otherwise produce nfl_<prior_year>.json. Bump annually.
        run: |
          Rscript -e '
            devtools::load_all()
            projections <- generate_projections(season = 2026)
            publish_projections(projections, out_dir = "build/feed", season = 2026)
            publish_manifest(out_dir = "build/feed", season = 2026)
          '

      - name: Stage v1 subtree for deploy
        # Deploy only the v1/ namespace + _meta.json. The root projections/
        # directory in bestball-bro-data belongs to Clay's legacy feed and
        # must not be touched by this workflow. keep_files: true (below)
        # preserves any path we do not stage here.
        run: |
          mkdir -p build/deploy
          cp -r build/feed/v1 build/deploy/
          cp build/feed/_meta.json build/deploy/

      - name: Publish to bestball-bro-data
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.BESTBALL_BRO_DATA_DEPLOY_KEY }}
          external_repository: libertyvincent/bestball-bro-data
          publish_branch: main
          publish_dir: build/deploy
          keep_files: true
          commit_message: "Automated feed update from bestball-bro-sim"
