name: Build and publish feed

# Daily during draft season (April–August), weekly during regular season.
# Adjust the cron expression as the season transitions, or split into two
# workflows with seasonal `on.schedule` blocks.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      tournaments:
        description: "Comma-separated tournament IDs to rebuild (default: all)"
        required: false
        default: "all"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # building blocks per tournament is the long pole

    steps:
      - name: Checkout sim repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::nflreadr
            any::nflfastR
            any::jsonlite
            any::yaml
            any::dplyr
            any::tidyr
            any::purrr
            any::arrow
            any::lubridate
            any::cli
            any::devtools

      - name: Verify tournament configs parse
        # load_tournaments() loads every YAML under inst/data/tournaments/
        # and validates each via .validate_tournament(), so this is the
        # one-shot replacement for the old list_tournaments() +
        # load_tournament_config() pair.
        run: Rscript -e 'devtools::load_all(); invisible(load_tournaments())'

      - name: Create build directories
        # Primes the feed tree so publish_* writes into an existing path.
        # (dir.create(recursive = TRUE) inside the publish functions also
        # handles this, but creating up front keeps the workflow obvious.)
        run: mkdir -p build/feed/v1/projections

      - name: Generate and publish v1 multi-slate feed
        # v1 pipeline: loop over every enabled slate in
        # inst/data/slates/_manifest.yaml, project from that slate's
        # Underdog CSV (canonical player universe), and emit one
        # v1/projections/<slate_id>.json per slate plus a unified
        # _meta.json at the feed root. Season simulations and Layer B
        # tournament precompute are still v1.5+ work.
        run: |
          Rscript -e '
            devtools::load_all()
            manifest <- load_slate_manifest()
            enabled  <- Filter(function(e) isTRUE(e$enabled), manifest)
            if (length(enabled) == 0L) stop("No enabled slates")
            slates_for_meta <- list()
            season_for_meta <- NULL
            model_version <- "1.0.0"
            for (sid in names(enabled)) {
              entry <- enabled[[sid]]
              cat("\n=== Slate:", sid, "===\n")
              proj <- generate_projections(slate_id = sid)
              publish_projections(proj, out_dir = "build/feed",
                                  slate_id = sid, slate_meta = entry,
                                  model_version = model_version)
              slates_for_meta[[sid]] <- list(
                underdog_slate_id = entry$underdog_slate_id,
                path              = paste0("v1/projections/", sid, ".json"),
                version           = model_version
              )
              if (is.null(season_for_meta)) season_for_meta <- entry$season
            }
            publish_manifest(out_dir = "build/feed",
                             slates = slates_for_meta,
                             season = season_for_meta)
          '

      - name: Stage v1 subtree for deploy
        # Deploy only the v1/ namespace + _meta.json. The root projections/
        # directory in bestball-bro-data belongs to Clay's legacy feed and
        # must not be touched by this workflow. keep_files: true (below)
        # preserves any path we do not stage here.
        run: |
          mkdir -p build/deploy
          cp -r build/feed/v1 build/deploy/
          cp build/feed/_meta.json build/deploy/

      - name: Run v2 blender + Monte Carlo simulator
        # Writes:
        #   build/deploy/v2/projections/<slate>.json  -> goes to gh-pages
        #   build/deploy/v2/draws/<slate>.parquet     -> moved to artifacts
        # Also updates build/deploy/_meta.json to register v2 entries
        # alongside the v1 entries that the v1 path wrote earlier.
        run: |
          Rscript -e 'devtools::load_all(); publish_v2(out_dir = "build/deploy", n_sims = 10000L)'

      - name: Move parquet draws out of publish dir
        # Parquet draws are server-side artifacts for Layer B; they must
        # NOT land on gh-pages (Pages has a 1 GB site soft limit; four
        # slates of 10K-sim draws total several GB). Relocate them to a
        # sibling tree that peaceiris will not see, then upload via
        # actions/upload-artifact below. Three paths must agree:
        #   (1) publish_v2 writes        build/deploy/v2/draws/*.parquet
        #   (2) this step moves them to  build/artifacts/v2-draws/*.parquet
        #   (3) upload-artifact step's   build/artifacts/v2-draws/*.parquet
        run: |
          mkdir -p build/artifacts/v2-draws
          mv build/deploy/v2/draws/*.parquet build/artifacts/v2-draws/
          rmdir build/deploy/v2/draws

      - name: Publish to bestball-bro-data
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.BESTBALL_BRO_DATA_DEPLOY_KEY }}
          external_repository: libertyvincent/bestball-bro-data
          publish_branch: gh-pages
          publish_dir: build/deploy
          keep_files: true
          commit_message: "Automated feed update from bestball-bro-sim"

      - name: Upload v2 draws as workflow artifact
        # Layer B's CI run (separate workflow, Sprint 3) will fetch this
        # artifact by name. 90-day retention is enough for the daily
        # cadence; older draws can be regenerated from the v2 JSON +
        # blender if ever needed.
        uses: actions/upload-artifact@v4
        with:
          name: v2-draws-${{ github.run_id }}
          path: build/artifacts/v2-draws/*.parquet
          retention-days: 90
