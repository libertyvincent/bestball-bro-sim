name: Build and publish feed

# Daily during draft season (April–August), weekly during regular season.
# Adjust the cron expression as the season transitions, or split into two
# workflows with seasonal `on.schedule` blocks.
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      tournaments:
        description: "Comma-separated tournament IDs to rebuild (default: all)"
        required: false
        default: "all"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # v2 publish at 10K sims/player across all slates

    steps:
      - name: Checkout sim repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            deps::.
            any::jsonlite
            any::yaml
            any::httr2
            any::digest
            any::dplyr
            any::tidyr
            any::purrr
            any::arrow
            any::lubridate
            any::cli
            any::devtools

      - name: Verify tournament configs parse
        # load_tournaments() loads every YAML under inst/data/tournaments/
        # and validates each via .validate_tournament(), so this is the
        # one-shot replacement for the old list_tournaments() +
        # load_tournament_config() pair.
        run: Rscript -e 'devtools::load_all(); invisible(load_tournaments())'

      - name: Create deploy directory
        # publish_v2() creates its own v2/ subtree; this just primes the
        # deploy root so the workflow paths are obvious.
        run: mkdir -p build/deploy

      - name: Run v2 blender + Monte Carlo simulator
        # The whole feed build. Writes:
        #   build/deploy/v2/projections/<slate>.json  -> goes to gh-pages
        #   build/deploy/v2/draws/<slate>.parquet     -> moved to artifacts
        #   build/deploy/_meta.json                   -> goes to gh-pages
        # _meta.json is authored here (season header + per-slate v2_path /
        # v2_sha256 / v2_generated_at); no other step creates or edits it.
        run: |
          Rscript -e 'devtools::load_all(); publish_v2(out_dir = "build/deploy", n_sims = 10000L)'

      - name: Build + publish EV-blocks artifacts (Artifact A + curves)
        # Wires publish_ev_blocks() into the deploy. For each configured slate
        # (ev_blocks_publish_config(): nfl_2026_season -> puppy2 + dachshund):
        # reuses the Layer A draws the previous step wrote
        #   build/deploy/v2/draws/<slate>.parquet
        # to build Artifact A (int16 joint-draws tensor at N=500) + the
        # per-tournament curves, then writes
        #   build/deploy/v2/ev/<slate>_draws.{bin,json}
        #   build/deploy/v2/ev/<id>_curves.json
        # and MERGES the v2_draws_* / tournaments.<id>.curves_* keys into the
        # existing _meta.json (the projection keys publish_v2 wrote are kept).
        # MUST run before the parquet move (it reads v2/draws/*.parquet); the
        # EV tensor lives in v2/ev/ and is NOT swept by that move, so it stays
        # on gh-pages. Adding a slate/tournament = one line in the config.
        run: |
          Rscript -e 'devtools::load_all(); publish_ev_blocks_pipeline(out_dir = "build/deploy")'

      - name: Move parquet draws out of publish dir
        # Parquet draws are server-side artifacts for Layer B; they must
        # NOT land on gh-pages (Pages has a 1 GB site soft limit; four
        # slates of 10K-sim draws total several GB). Relocate them to a
        # sibling tree that peaceiris will not see, then upload via
        # actions/upload-artifact below. Three paths must agree:
        #   (1) publish_v2 writes        build/deploy/v2/draws/*.parquet
        #   (2) this step moves them to  build/artifacts/v2-draws/*.parquet
        #   (3) upload-artifact step's   build/artifacts/v2-draws/*.parquet
        run: |
          mkdir -p build/artifacts/v2-draws
          mv build/deploy/v2/draws/*.parquet build/artifacts/v2-draws/
          rmdir build/deploy/v2/draws

      - name: Publish to bestball-bro-data
        # build/deploy now contains only v2/ + _meta.json. keep_files: true
        # preserves everything else already on gh-pages (Clay/ETR/LegUp
        # source feeds, the legacy root projections/ directory).
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.BESTBALL_BRO_DATA_DEPLOY_KEY }}
          external_repository: libertyvincent/bestball-bro-data
          publish_branch: gh-pages
          publish_dir: build/deploy
          keep_files: true
          commit_message: "Automated feed update from bestball-bro-sim"

      - name: Upload v2 draws as workflow artifact
        # Layer B's CI run (separate workflow, Sprint 3) will fetch this
        # artifact by name. 90-day retention is enough for the daily
        # cadence; older draws can be regenerated from the v2 JSON +
        # blender if ever needed.
        uses: actions/upload-artifact@v4
        with:
          name: v2-draws-${{ github.run_id }}
          path: build/artifacts/v2-draws/*.parquet
          retention-days: 90
